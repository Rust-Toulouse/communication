<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meetup Rust Toulouse · Watercolor (big screen)</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/stage.css">
<style>
  :root {
    --sky: #c3d6db;
    --ink: #1b2440;
    --ink-soft: #33405f;
    --rust: #d24f1b;
    --rust-deep: #9c3612;
    --paper: #fffaf1;
    --line: rgb(27 36 64 / 0.16);
    /* Flat "ghost" shadow copied from the crab artwork: unblurred, offset right/down, 20% opacity */
    --ghost-color: #2d1405;
    --ghost: 12px 4px 0 rgb(45 20 5 / 0.2);
  }
  html, body, .slide { background: var(--sky); }
  .slide { font-family: 'Bricolage Grotesque', system-ui, sans-serif; color: var(--ink); }

  /* Full-bleed watercolor; the Grave dome stays clear on the left */
  .bg { inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* Light wash behind the title for legibility over the clouds */
  .wash {
    inset: 0;
    background: radial-gradient(1250px 360px at 1180px 160px,
      rgb(246 250 251 / 0.78), rgb(246 250 251 / 0.45) 45%, rgb(246 250 251 / 0) 75%);
  }

  /* Title */
  .head { left: 612px; top: 66px; }
  .title { margin: 0; font-size: 148px; line-height: 0.92; font-weight: 800; font-stretch: 76%; letter-spacing: -0.015em; }
  .title em { font-style: normal; color: var(--rust); }
  .lede { margin: 20px 0 0; font-size: 48px; line-height: 1.1; font-weight: 500; color: var(--ink-soft); }
  .lede strong { font-weight: 800; color: var(--ink); }

  /* QR postcard — QR at 35% of the slide height (big screen), steps below */
  .card {
    left: 636px; top: 330px; width: 440px;
    padding: 30px 30px 26px;
    background: var(--paper);
    border-radius: 30px;
    box-shadow: var(--ghost);
    transform: rotate(-1.5deg);
  }
  .card img { width: 100%; }
  .steps {
    display: grid; gap: 10px;
    margin: 18px 0 0; padding: 0; list-style: none;
    font-size: 26px; line-height: 1.2; font-weight: 600;
  }
  .steps li { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
  .step-num {
    flex: none; display: grid; place-items: center;
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--rust); color: #fff; font-size: 22px; font-weight: 800;
  }
  .channel {
    padding: 2px 9px; border-radius: 8px;
    background: #fbe2d1; color: var(--rust-deep);
    font-family: 'JetBrains Mono', monospace; font-size: 0.95em; font-weight: 800;
  }

  /* The crab sits on the rooftops; the kid's finger points at the centre of the QR code */
  .crab { left: 1100px; top: 312px; width: 740px; }

  /* Meetup group: a postage stamp in the top-left sky, beside the dome's lantern.
     Perforations = transparent holes on an 18px grid around a solid inner panel.
     The ghost shadow is a perforated copy behind it. No CSS `filter` on purpose: some browsers
     don't repaint filtered layers once the web font loads, leaving the text invisible. */
  .stamp { left: 34px; top: 40px; width: 216px; height: 198px; transform: rotate(-4deg); }
  .stamp::before, .stamp-paper {
    background:
      linear-gradient(var(--c), var(--c)) 9px 9px / calc(100% - 18px) calc(100% - 18px) no-repeat,
      radial-gradient(circle, transparent 5.5px, var(--c) 6px) -9px -9px / 18px 18px round;
  }
  .stamp::before { content: ""; position: absolute; inset: 0; --c: var(--ghost-color); opacity: 0.2; transform: translate(12px, 4px); }
  .stamp-paper { position: relative; height: 100%; padding: 18px; --c: var(--paper); }
  .stamp-frame {
    height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    border: 1.5px solid var(--line); border-radius: 3px;
    font-size: 28px; line-height: 1; font-weight: 800; font-stretch: 82%; letter-spacing: -0.01em;
  }

  /* Sponsors postcard: sibling of the QR card, tilted the other way, centred on the dome's axis */
  .sponsors {
    left: 92px; bottom: 40px; width: 476px;
    padding: 18px 28px 22px;
    background: var(--paper);
    border-radius: 22px;
    box-shadow: var(--ghost);
    transform: rotate(1.5deg);
  }
  .sponsors-label {
    display: flex; justify-content: center; align-items: center; gap: 10px;
    font-size: 16px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft);
  }
  .sponsors-label span { font-size: 24px; letter-spacing: 0.04em; }
  .sponsor-main {
    display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 10px;
    font-family: 'JetBrains Mono', monospace; font-size: 38px; font-weight: 800; letter-spacing: -0.02em;
  }
  .sponsor-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 14px; padding-top: 16px; border-top: 1.5px solid var(--line);
  }
</style>
</head>
<body>
<main class="slide" aria-label="Meetup Rust Toulouse — rejoins la communauté Toulouse Tech">
  <img class="bg" src="assets/toulouse-watercolor.png" alt="">
  <div class="wash"></div>

  <aside class="sponsors" aria-label="Sponsors">
    <div class="sponsors-label">Merci à nos sponsors <span>🍕🍺</span></div>
    <div class="sponsor-main"><img src="assets/sponsors/bashroom.svg" alt="" height="46">Bashroom</div>
    <div class="sponsor-row">
      <img src="assets/sponsors/kaizen.svg" alt="Kaizen Solutions" height="38">
      <img src="assets/sponsors/monkeypatch.svg" alt="MonkeyPatch" height="22">
      <img src="assets/sponsors/devfest.svg" alt="DevFest Toulouse" height="35">
    </div>
  </aside>

  <header class="head">
    <h1 class="title">Meetup <em>Rust</em> Toulouse</h1>
    <p class="lede">Rejoins la communauté <strong>Toulouse Tech</strong> sur Slack</p>
  </header>

  <aside class="stamp" aria-label="Notre groupe Meetup : Rust Toulouse (meetup.com/rust-community-toulouse)">
    <div class="stamp-paper">
      <div class="stamp-frame">
        <img src="assets/meetup-logo.png" alt="Meetup" height="88">
        Rust Toulouse
      </div>
    </div>
  </aside>

  <section class="card" aria-label="QR code d'invitation au Slack Toulouse Tech">
    <img src="assets/qr-slack-invite.svg" alt="QR code : invitation au Slack Toulouse Tech">
    <ol class="steps">
      <li><span class="step-num">1</span><span>Scanne le QR code</span></li>
      <li><span class="step-num">2</span><span>Rejoins le channel <span class="channel">#_rust</span></span></li>
    </ol>
  </section>

  <img class="crab bob" src="assets/rust-crab.png" alt="Le crabe Rust et trois membres de la communauté ; l'un d'eux montre le QR code du doigt">
</main>
<script src="assets/stage.js"></script>
</body>
</html>
